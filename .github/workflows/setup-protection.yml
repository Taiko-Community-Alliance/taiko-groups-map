name: Setup Branch Protection

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  setup-protection:
    name: Configure Branch Protection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      repository-projects: write
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GitHub CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure GitHub CLI
        run: |
          echo "🔑 Configuring GitHub CLI..."
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          echo "✅ GitHub CLI configured"

      - name: Enable required status checks for main branch
        run: |
          echo "🛡️ Setting up branch protection for main branch..."
          
          # Enable branch protection with comprehensive rules
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/Taiko-Community-Alliance/taiko-groups-map/branches/main/protection \
            -f '{
              "required_status_checks": {
                "strict": true,
                "contexts": [
                  "Build and Deploy to GitHub Pages",
                  "Security Scan",
                  "Dependency Update Check"
                ]
              },
              "enforce_admins": true,
              "required_pull_request_reviews": {
                "required_approving_review_count": 1,
                "require_code_owner_reviews": true,
                "require_last_push_approval": true,
                "bypass_pull_request_allowances": {
                  "users": [],
                  "teams": ["Taiko-Community-Alliance/taiko-groups-map-maintainers"]
                }
              },
              "restrictions": null,
              "required_linear_history": true,
              "allow_force_pushes": false,
              "allow_deletions": false,
              "required_conversation_resolution": true
            }'
          
          echo "✅ Branch protection configured for main branch"

      - name: Verify branch protection
        run: |
          echo "🔍 Verifying branch protection..."
          
          # Get branch protection settings
          PROTECTION=$(gh api /repos/Taiko-Community-Alliance/taiko-groups-map/branches/main/protection)
          
          echo "📋 Branch Protection Settings:"
          echo "=============================="
          
          echo "✅ Required Status Checks:"
          echo "$PROTECTION" | jq -r '.required_status_checks.contexts[]' | sed 's/^/  - /'
          
          echo ""
          echo "✅ Required Approving Reviews: $(echo "$PROTECTION" | jq -r '.required_pull_request_reviews.required_approving_review_count')"
          echo "✅ Code Owner Reviews Required: $(echo "$PROTECTION" | jq -r '.required_pull_request_reviews.require_code_owner_reviews')"
          echo "✅ Enforce Admins: $(echo "$PROTECTION" | jq -r '.enforce_admins')"
          echo "✅ Linear History Required: $(echo "$PROTECTION" | jq -r '.required_linear_history')"
          echo "✅ Force Pushes Allowed: $(echo "$PROTECTION" | jq -r '.allow_force_pushes')"
          echo "✅ Branch Deletions Allowed: $(echo "$PROTECTION" | jq -r '.allow_deletions')"
          echo "✅ Conversation Resolution Required: $(echo "$PROTECTION" | jq -r '.required_conversation_resolution')"
          
          echo ""
          echo "🎉 Branch protection successfully configured!"

      - name: Create welcome issue
        run: |
          echo "📝 Creating welcome issue for contributors..."
          
          ISSUE_BODY=$(cat << 'EOF'
This repository now has professional-grade branch protection rules and templates!

## 🎉 What's Been Set Up

### ✅ Branch Protection Rules
- **Required Status Checks:** Build, Security Scan, Dependency Check
- **Required Reviews:** 1 approving review required
- **Code Owner Reviews:** Required for all changes
- **Enforce Admins:** Even admins must follow rules
- **Linear History:** No merge commits allowed
- **No Force Pushes:** History is protected
- **No Branch Deletions:** Main branch is protected

### ✅ Issue Templates
- 🐛 Bug Report - Standardized bug reporting
- ✨ Feature Request - Submit new ideas
- 📚 Documentation - Improve documentation

### ✅ Pull Request Template
- Clear PR description template
- Checklist for contributors
- Standardized format

### ✅ CODEOWNERS
- Clear ownership for all files
- Automatic reviewer assignment
- Maintainer team specified

## 🤝 How to Contribute

1. **Fork the repository**
2. **Create a feature branch** from main
3. **Make your changes**
4. **Submit a Pull Request**
5. **Get reviews** from maintainers
6. **Merge when approved**

## 📚 Documentation

- **README.md** - Complete project documentation
- **CONTRIBUTING.md** - Contribution guidelines
- **CODE_OF_CONDUCT.md** - Community standards

---

🎉 **Happy contributing!**

*Thank you for helping improve Taiko Groups Map!*
EOF
          )
          
          gh issue create \
            --title "🎉 Professional Repository Setup Complete" \
            --body "$ISSUE_BODY" \
            --label "announcement,good-first-issue"
          
          echo "✅ Welcome issue created"

      - name: Display setup summary
        run: |
          echo ""
          echo "📊 Repository Setup Summary"
          echo "=========================="
          echo "✅ Branch protection configured"
          echo "✅ Issue templates added"
          echo "✅ PR template added"
          echo "✅ CODEOWNERS file created"
          echo "✅ Documentation updated"
          echo "✅ Security workflow added"
          echo "✅ Build workflow enhanced"
          echo ""
          echo "🎯 Your repository is now production-ready!"
          echo ""
          echo "🔗 Repository: https://github.com/Taiko-Community-Alliance/taiko-groups-map"
          echo "🌐 Website: https://taiko-community-alliance.github.io/taiko-groups-map/"
          echo ""
          echo "🚀 Next Steps:"
          echo "  1. Visit your repository settings"
          echo "  2. Verify branch protection is active"
          echo "  3. Check issue templates work"
          echo "  4. Start contributing!"