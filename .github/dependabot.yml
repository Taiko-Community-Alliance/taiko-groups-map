# Dependabot Configuration for Taiko Groups Map
# Automatically updates dependencies to keep them secure and up-to-date

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"  # Check for updates daily
      time: "06:00"      # Run at 6 AM UTC
      timezone: "UTC"
    open-pull-requests-limit: 10  # Maximum 10 open PRs at once
    reviewers:
      - hanbini96
      - Taiko-Community-Alliance/taiko-groups-map-maintainers
    assignees:
      - hanbini96
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    milestone: 1
    pull-request-branch-name:
      separator: "-"
    target-branch: "main"
    versioning-strategy: "auto"  # Automatically determine version updates

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"  # Check for updates weekly
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - hanbini96
      - Taiko-Community-Alliance/taiko-groups-map-maintainers
    assignees:
      - hanbini96
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    milestone: 1
    pull-request-branch-name:
      separator: "-"
    target-branch: "main"

  # Enable version updates for Docker (if used in future)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - hanbini96
    labels:
      - "dependencies"
      - "docker"
      - "automated"

